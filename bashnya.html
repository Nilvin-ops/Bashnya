$('dice').onclick=()=>{$('nin').textContent=rndName()};
$('rename').onclick=askName;
$('nin').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
reset();if(!myName){state='name';askName()}requestAnimationFrame(frame);
</script>
